# ============================================================
# DOCKER COMPOSE — multi-container orchestra sa atoang project
# ============================================================
# Ang docker-compose.yml mag-defini sa TANAN nga services
# (containers) nga mo-dagan together sa usa ka command:
#     docker compose up -d
#
# Ang 4 ka services:
#   app         -> PHP-FPM (Laravel code)
#   nginx       -> web server (port 8000)
#   mysql       -> database server
#   phpmyadmin  -> web UI para sa database (port 8080)
#
# Silang upat mag-share og usa ka internal network — maka-
# communicate sila gamit ang service names (e.g. "mysql").

services:

  # ==========================================================
  # APP — ang Laravel application (PHP-FPM)
  # ==========================================================
  # Dinhi modagan ang tanan nga PHP code. Ang Nginx mo-forward
  # sa .php requests dinhi pinaagi sa port 9000.
  app:
    # "build: ." = ayaw pull og image — himua gikan sa Dockerfile
    # nga naa sa parehas nga folder.
    build: .

    volumes:
      # BIND MOUNT: ang imong project folder gi-attach diretso
      # ngadto sa container. Kung mo-edit ka og file sa imong PC,
      # dayon makita sa container — perfect para sa development!
      - .:/var/www/html

      # NAMED VOLUME: ang vendor/ (composer dependencies) gikan
      #   sa image dili ma-override sa bind mount. Kung wala ni,
      #   "matabunan" sa walay sulod nga vendor/ sa imong PC ang
      #   vendor/ nga na-install sulod sa image.
      - vendor_data:/var/www/html/vendor

    # Environment variables — kini MO-OVERRIDE sa .env file.
    # Sa development walay problema; sa production, mas maayo
    # nga i-use ang environment variables kaysa .env file.
    environment:
      APP_ENV: local              # development mode
      APP_DEBUG: "true"           # ipakita ang detailed errors
      APP_URL: http://localhost:8000

      # I-switch ang Laravel gikan sa SQLite ngadto sa MySQL:
      DB_CONNECTION: mysql
      # IMPORTANTE: "mysql" DILI localhost! Mao ni ang service
      # name sa MySQL container. Ang Docker DNS mo-resolve niini
      # ngadto sa internal IP sa mysql container.
      DB_HOST: mysql
      DB_PORT: 3306               # default nga MySQL port
      DB_DATABASE: ecommerce
      DB_USERNAME: laravel
      DB_PASSWORD: secret

    # Dili mo-sugod ang app hangtod nga "healthy" na ang mysql.
    # Kung wala ni, posible nga mo-sugod ang app SAM PA nga
    # nag-initialize pa ang MySQL — mo-crash.
    depends_on:
      mysql:
        condition: service_healthy


  # ==========================================================
  # NGINX — web server / traffic director
  # ==========================================================
  # Modawat sa requests gikan sa browser, mo-serve og static
  # files, ug mo-forward sa PHP ngadto sa app service.
  nginx:
    image: nginx:alpine           # "alpine" = extra lightweight version

    ports:
      # "host:container" — ang localhost:8000 sa imong PC
      # mo-point sa port 80 sulod sa nginx container.
      - "8000:80"

    volumes:
      # Parehas nga code mount — ang Nginx kinahanglan makita
      #   ang public/ folder para mo-serve og static files
      #   (CSS, images, robots.txt, etc.)
      - .:/var/www/html
      # I-mount ang atoang custom config — mo-replace sa default
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app                       # maghuwat nga mo-sugod ang app


  # ==========================================================
  # MYSQL — database server
  # ==========================================================
  mysql:
    image: mysql:8.4

    environment:
      # Kini nga variables gi-process sa official MySQL image
      # sa unang boot lang (kung walay sulod ang mysql_data volume):
      MYSQL_DATABASE: ecommerce       # automatic nga himuon nga database
      MYSQL_USER: laravel             # himuon nga non-root user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root       # password sa root user

    volumes:
      # NAMED VOLUME — ang data magsalbar bisan i-delete ang
      #   container. Kung wala ni, mawala ang tanan nga data
      #   matag "docker compose down".
      - mysql_data:/var/lib/mysql

    # HEALTHCHECK: si Docker mo-check matag 5 segundos kung
    #   buhi ba ang MySQL. Ang "mysqladmin ping" = pangutana:
    #   "andam ka na ba modawat og connections?"
    #   Gamiton sa depends_on sa taas.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s            # matag 5 segundos i-check
      timeout: 3s             # 3 segundos ang timeout sa matag check
      retries: 20             # 20 ka attempts usa i-consider nga "unhealthy"


  # ==========================================================
  # PHPMYADMIN — web UI para sa database
  # ==========================================================
  # Para sa mga students: makita ninyo ang tables, records, ug
  # mag-run og SQL queries pinaagi sa browser — walay CLI!
  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    ports:
      - "8080:80"                   # http://localhost:8080

    environment:
      PMA_HOST: mysql               # i-pre-fill ang server field
      PMA_PORT: 3306
      # I-set ang root password para maka-login dayon
      #   (username: root, password: root)
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy  # maghuwat sa healthy nga MySQL


# ============================================================
# NAMED VOLUMES — persistent data storage
# ============================================================
# Ang mga volumes = data nga DILI madala sa container kung
# i-delete o i-recreate. Murag "external hard drive" sa container.
volumes:
  mysql_data:    # database files sa MySQL
  vendor_data:   # composer dependencies sa app
