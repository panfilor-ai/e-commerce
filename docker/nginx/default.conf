# ============================================================
# NGINX CONFIG — ang "traffic director" sa atoang app
# ============================================================
# Ang Nginx maoy web server: modawat sa HTTP requests gikan sa
# browser, mo-serve og static files (images, CSS), ug mo-forward
# sa PHP requests ngadto sa PHP-FPM container.
#
# Gi-mount ni pinaagi sa docker-compose.yml:
#   ./docker/nginx/default.conf -> /etc/nginx/conf.d/default.conf


server {
    # ----------------------------------------------------------
    # listen — unsa nga port ang paminawon sulod sa container
    # ----------------------------------------------------------
    # Port 80 = standard HTTP port. Ang docker-compose nag-map
    # sa imong PC nga port 8000 ngadto niining port 80.
    # (localhost:8000 -> container:80)
    listen 80;

    # ----------------------------------------------------------
    # server_name — unsa nga domain/hostname ang match-an
    # ----------------------------------------------------------
    # Ang "_" = wildcard — match bisan unsa:
    # localhost, 127.0.0.1, imong LAN IP, etc.
    server_name _;

    # ----------------------------------------------------------
    # root — diin makita ang mga web files
    # ----------------------------------------------------------
    # IMPORTANTE: ang public/ LANG ang ma-access sa web.
    # Ang .env, app/, storage/, ug uban pang sensitive files
    # DILI mahimo ma-download sa bisan kinsa — security feature!
    root /var/www/html/public;

    # Default nga file nga ipakita kung directory ang gi-request.
    index index.php index.html;


    # ----------------------------------------------------------
    # location / — ang main nga routing rule
    # ----------------------------------------------------------
    # try_files = mosulay sa mga kapilian sunod sa order:
    #   1. $uri      -> file ba ni? (pananglitan /favicon.ico)
    #   2. $uri/     -> directory ba ni?
    #   3. /index.php?$query_string
    #                -> kung wala ang duha, i-pass sa Laravel
    #                   ang request (apil ang ?query=string)
    #
    # MAO NI ang sekreto sa "pretty URLs" sama sa /products/3 —
    # wala koy file nga "products/3", si Laravel mo-handle niini.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ----------------------------------------------------------
    # location ~ \.php$ — kung .php ang file, ipadala sa PHP-FPM
    # ----------------------------------------------------------
    # Ang "~ \.php$" = regular expression nga mo-match sa bisan
    # unsa nga URL nga mohunong og ".php".
    location ~ \.php$ {

        # fastcgi_pass = ipadala ngadto sa PHP-FPM pinaagi sa
        #   FastCGI protocol (dili HTTP — mas paspas nga internal
        #   protocol para sa web server ngadto sa PHP)
        #
        # "app" = service name sa docker-compose.yml.
        #   Ang Docker nay mo-resolve niini ngadto sa IP sa
        #   app container (internal DNS sa Docker network).
        # 9000 = default nga port sa PHP-FPM.
        fastcgi_pass app:9000;

        # Kung directory URL ang gi-request (pananglitan /),
        # unsa nga .php file ang gamiton.
        fastcgi_index index.php;

        # I-sultihi si PHP kung UNSA nga file ang i-execute.
        #   $realpath_root = document root nga gi-resolve na
        #                    ang symlinks (importante sa
        #                    public/storage nga symlink)
        #   $fastcgi_script_name = ang gi-request nga .php file
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # I-apil ang standard nga FastCGI parameters:
        #   REQUEST_METHOD, QUERY_STRING, REMOTE_ADDR, etc.
        #   (gi-defini sa /etc/nginx/fastcgi_params file)
        include fastcgi_params;
    }


    # ----------------------------------------------------------
    # SECURITY RULE — block ang mga hidden files
    # ----------------------------------------------------------
    # Ang mga file nga magsugod og "." (sama sa .env, .git/)
    # dili gyud ma-access sa web — EXTRA layer sa proteksyon
    # bisan tuod naa man sila sa gawas sa public/ folder.
    #
    # Ang "(?!well-known)" = exception sa .well-known/ folder
    #   kay gamiton na sa Let's Encrypt (HTTPS certificates).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
